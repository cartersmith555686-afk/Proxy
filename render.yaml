# Render Blueprint. In Render: New + > Blueprint > pick this repo.
#
# FREE PLAN CAVEATS (as documented by Render):
#   - the service sleeps after 15 min with no traffic and takes ~1 min to wake
#   - the filesystem is wiped on every deploy, restart and spin-down,
#     so ACCOUNTS AND SAVED SETTINGS DO NOT SURVIVE on the free plan
#     (guests are unaffected: their settings live in their own browser)
#
# To keep accounts, use a paid plan with a disk: change `plan` to `starter`,
# uncomment the `disk` block, and set DATA_DIR to the same path as mountPath.
services:
  - type: web
    name: orbit
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: ./data
      # - key: DATA_DIR            # when using the disk below, use this instead of ./data
      #   value: /var/data
      # - key: AI_BASE_URL         # optional: swap the free AI endpoint
      #   value: https://api.groq.com/openai/v1
      # - key: AI_API_KEY
      #   sync: false              # Render prompts you for it, never stored in git
      # - key: AI_MODEL
      #   value: llama-3.1-8b-instant
    # disk:
    #   name: orbit-data
    #   mountPath: /var/data
    #   sizeGB: 1
